[package]
name = "smart-claude-router"
version = "0.1.0"
edition = "2021"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "smart-claude-router"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
