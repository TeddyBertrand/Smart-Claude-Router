# Smart-Claude-Router config.
#
# Copy to ~/.config/smart-claude-router/config.toml (or $XDG_CONFIG_HOME/...) and change what
# you need. Every key is optional: anything you leave out keeps the value shown here, and with
# no file at all the proxy uses exactly these values.

# Address the proxy listens on. Point Claude Code at it with
#   ANTHROPIC_BASE_URL=http://127.0.0.1:8899 claude
# Keep it on 127.0.0.1: requests carry your Claude login.
listen = "127.0.0.1:8899"

# Where requests are forwarded.
upstream = "https://api.anthropic.com"

# Tier used when routing has no better answer: "low", "medium" or "high".
# "high" matches what Claude Code uses by default, so nothing changes until you lower it.
default_tier = "high"

# "route": routing decisions change your requests.
# "observe": dry run. Decisions are computed and logged ("dry run: would route"), but every
# request is forwarded exactly as Claude Code sent it. `--dry-run` on the command line does
# the same and wins over this setting.
mode = "route"

# Which router picks the tier of each new message:
# "rules": your checklist (see [rules] below). It only acts when [rules] enabled = true.
# "classifier": a local Ollama model grades each message (see [classifier] below). Choosing it
# turns routing on: unlike the rules, it needs no separate "enabled" switch.
router = "rules"

# The models the router chooses between (routing arrives in v0.2.0).
# effort: "low", "medium", "high", "xhigh" or "max".
# A tier you write here needs both model and effort; tiers you leave out keep these values.

[tiers.low]
model = "claude-haiku-5-5"
effort = "medium"

[tiers.medium]
model = "claude-sonnet-5-5"
effort = "high"

[tiers.high]
model = "claude-opus-5-5"
effort = "xhigh"

# The rules router (see docs/rules.md). Off by default: with enabled = false every request
# is forwarded unchanged and the rules below are ignored.
#
# For each new message you send, the router picks a tier:
#   1. an override marker in your message wins: !low, !medium or !high
#   2. otherwise the first rule below that matches, top to bottom
#   3. otherwise default_tier
#
# A rule matches when every condition it lists is true. Conditions you leave out are not checked.
# Rules are written as [[rules.rule]] blocks. Examples (uncomment and change):
#
# [[rules.rule]]
# name = "small-fix"                       # shown as the reason in the log
# tier = "low"                             # "low", "medium" or "high"
# keywords = ["typo", "rename", "format"]  # message contains any of these (any letter case)
# max_chars = 300                          # message is at most this many characters
#
# [[rules.rule]]
# name = "big-design"
# tier = "high"
# keywords = ["architecture", "redesign", "refactor"]
#
# [[rules.rule]]
# name = "screenshot"
# tier = "medium"
# images = true                            # the message includes an image
#
# Other conditions: min_chars, min_messages, max_messages (messages so far in the conversation)
# and model_contains (the model Claude Code asked for contains this text, e.g. "haiku").

[rules]
enabled = false

# The local-model classifier (see docs/classifier.md). Used when router = "classifier".
# Your message text is sent to the url below, so keep it on this machine.
#
# url: where Ollama listens.
# model: the Ollama model that grades messages. Pull it first: `ollama pull qwen2.5:3b`.
# timeout_ms: longest wait for an answer. After that the fallback decides (see below).
# keep_alive: how long Ollama keeps the model loaded after a call ("-1" = always), so a call
# never waits for the model to load.
# min_confidence: answers the model is less sure about than this (0 to 1) are not used.
# failure_limit, cooldown_secs: after this many failures in a row the classifier is not called
# for this many seconds, so a stopped Ollama does not add a wait to every message.
#
# The fallback, used whenever the classifier gives no usable answer: the rules router if
# [rules] enabled = true, otherwise default_tier.
# max_chars: most characters of your message the classifier sees. A longer message keeps its
# start and its end, with the middle cut out (see docs/classifier-prompt.md).
# prompt_file: path to your own classifier prompt, replacing the built-in one. Not set by default.

[classifier]
url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"
timeout_ms = 500
keep_alive = "30m"
min_confidence = 0.5
failure_limit = 3
cooldown_secs = 30
max_chars = 600
# prompt_file = "/home/you/classifier-prompt.md"
