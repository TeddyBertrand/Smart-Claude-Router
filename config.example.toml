# Smart-Claude-Router config.
#
# Copy to ~/.config/smart-claude-router/config.toml (or $XDG_CONFIG_HOME/...) and change what
# you need. Every key is optional: anything you leave out keeps the value shown here, and with
# no file at all the proxy uses exactly these values.

# Address the proxy listens on. Point Claude Code at it with
#   ANTHROPIC_BASE_URL=http://127.0.0.1:8899 claude
# Keep it on 127.0.0.1: requests carry your Claude login.
listen = "127.0.0.1:8899"

# Where requests are forwarded.
upstream = "https://api.anthropic.com"

# Tier used when routing has no better answer: "low", "medium" or "high".
# "high" matches what Claude Code uses by default, so nothing changes until you lower it.
default_tier = "high"

# The models the router chooses between (routing arrives in v0.2.0).
# effort: "low", "medium", "high", "xhigh" or "max".
# A tier you write here needs both model and effort; tiers you leave out keep these values.

[tiers.low]
model = "claude-haiku-5-5"
effort = "medium"

[tiers.medium]
model = "claude-sonnet-5-5"
effort = "high"

[tiers.high]
model = "claude-opus-5-5"
effort = "xhigh"

# The rules router (see docs/rules.md). Off by default: with enabled = false every request
# is forwarded unchanged and the rules below are ignored.
#
# For each new message you send, the router picks a tier:
#   1. an override marker in your message wins: !low, !medium or !high
#   2. otherwise the first rule below that matches, top to bottom
#   3. otherwise default_tier
#
# A rule matches when every condition it lists is true. Conditions you leave out are not checked.
# Rules are written as [[rules.rule]] blocks. Examples (uncomment and change):
#
# [[rules.rule]]
# name = "small-fix"                       # shown as the reason in the log
# tier = "low"                             # "low", "medium" or "high"
# keywords = ["typo", "rename", "format"]  # message contains any of these (any letter case)
# max_chars = 300                          # message is at most this many characters
#
# [[rules.rule]]
# name = "big-design"
# tier = "high"
# keywords = ["architecture", "redesign", "refactor"]
#
# [[rules.rule]]
# name = "screenshot"
# tier = "medium"
# images = true                            # the message includes an image
#
# Other conditions: min_chars, min_messages, max_messages (messages so far in the conversation)
# and model_contains (the model Claude Code asked for contains this text, e.g. "haiku").

[rules]
enabled = false
